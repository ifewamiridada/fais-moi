<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit a notif</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#2B0A0E;background:#FCF3F1}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:#B0121F}a:hover{color:#5A0E18}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #4A2328">

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: #FCF3F1; border-radius: 28px 28px 0 0; box-sizing: border-box; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E7B4BD"></div>

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Review.dc.html" style="height: 44px; display: flex; align-items: center; font-weight: 500; color: #5A0E18; text-decoration: none">Cancel</a>
<span style="font-weight: 600; font-size: 16px">Edit notif</span>
<a href="Review.dc.html" style="height: 44px; display: flex; align-items: center; font-weight: 700; color: #B0121F; text-decoration: none">Save</a>
</div>

<div style="display: flex; gap: 12px; align-items: center">
<div role="radiogroup" aria-label="Icon" style="display: flex; gap: 8px">
<button role="radio" aria-checked="true" aria-label="Bowl" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #2B0A0E; background: #F6C3CC; color: #5A0E18; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg></button>
<button role="radio" aria-checked="false" aria-label="Sun" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #FBE3E7; color: #5A0E18; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button role="radio" aria-checked="false" aria-label="Drop" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #FBE3E7; color: #5A0E18; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></button>
<button role="radio" aria-checked="false" aria-label="Moon" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #FBE3E7; color: #5A0E18; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
<button aria-label="More icons" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #FBE3E7; color: #5A0E18; font-size: 18px; letter-spacing: 1px">···</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t" style="font-size: 13px; font-weight: 600; color: #5A0E18">Title</label>
<input id="t" value="Lunch check" style="height: 48px; border: 1.5px solid #2B0A0E; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #2B0A0E">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="m" style="font-size: 13px; font-weight: 600; color: #5A0E18">Message · day 12 of 30</label>
<a href="#all" style="font-size: 13px; font-weight: 600">All 30 messages</a>
</div>
<textarea id="m" rows="2" style="resize: none; border: 1px solid #F1D3D8; border-radius: 14px; background: #FFFFFF; padding: 12px 14px; font-size: 15px; line-height: 1.4; color: #2B0A0E">Aim for protein + fibre + something colourful.</textarea>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #FFFFFF; border: 1px solid #F1D3D8; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #7D4B52">Time</span><span style="font-family: Fraunces, serif; font-weight: 600; font-size: 22px">1:00 PM</span></div>
<div style="background: #FFFFFF; border: 1px solid #F1D3D8; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #7D4B52">If I miss it</span><span style="font-weight: 600; font-size: 15px; padding-top: 4px">Nudge once, +30 min</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #5A0E18">Repeat on</div>
<div role="group" aria-label="Days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<button aria-pressed="true" aria-label="Monday" style="height: 44px; border-radius: 50%; border: 0; background: #2B0A0E; color: #FCF3F1; font-weight: 600">M</button>
<button aria-pressed="true" aria-label="Tuesday" style="height: 44px; border-radius: 50%; border: 0; background: #2B0A0E; color: #FCF3F1; font-weight: 600">T</button>
<button aria-pressed="true" aria-label="Wednesday" style="height: 44px; border-radius: 50%; border: 0; background: #2B0A0E; color: #FCF3F1; font-weight: 600">W</button>
<button aria-pressed="true" aria-label="Thursday" style="height: 44px; border-radius: 50%; border: 0; background: #2B0A0E; color: #FCF3F1; font-weight: 600">T</button>
<button aria-pressed="true" aria-label="Friday" style="height: 44px; border-radius: 50%; border: 0; background: #2B0A0E; color: #FCF3F1; font-weight: 600">F</button>
<button aria-pressed="true" aria-label="Saturday" style="height: 44px; border-radius: 50%; border: 0; background: #2B0A0E; color: #FCF3F1; font-weight: 600">S</button>
<button aria-pressed="false" aria-label="Sunday" style="height: 44px; border-radius: 50%; border: 1.5px solid #E7B4BD; background: transparent; color: #5A0E18; font-weight: 600">S</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #5A0E18">How it lands</div>
<div role="group" aria-label="Priority" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #FBE3E7; border-radius: 16px; padding: 4px">
<button style="height: 44px; border: 0; border-radius: 12px; background: transparent; color: #5A0E18; font-weight: 500">Silent</button>
<button aria-pressed="true" style="height: 44px; border: 0; border-radius: 12px; background: #2B0A0E; color: #FCF3F1; font-weight: 600">Gentle</button>
<button style="height: 44px; border: 0; border-radius: 12px; background: transparent; color: #5A0E18; font-weight: 500">Can't miss</button>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; border: 1px solid #F1D3D8; border-radius: 14px; padding: 8px 12px 8px 14px">
<div style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">Optional</span><span style="font-size: 12px; color: #7D4B52">Skipping won't nudge you again</span></div>
<button aria-label="Optional off" aria-pressed="false" style="width: 48px; height: 28px; border-radius: 14px; border: 0; background: #E7C9CE; padding: 3px; display: flex; justify-content: flex-start"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></button>
</div>

<button style="margin-top: auto; height: 48px; border: 0; background: transparent; color: #B0121F; font-weight: 600; font-size: 15px">Turn off this notif</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

return {};
}
}
</script>
</body>
</html>
